# Git hooks, run by prek (https://prek.j178.dev). Install with:
#   uv run --project server prek install
# Workspace mode: server/prek.toml adds the server's own hooks. Hooks here run
# on every file in the repository, including those in server/.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    # The generated API client is large by nature (app/scripts/generate-api.sh).
    { id = "check-added-large-files", exclude = "^app/Packages/EPAPI/Sources/EPAPI/Generated/" },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "detect-private-key" },
]
