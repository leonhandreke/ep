[project]
name = "ep"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.0",
    "httpx2>=2.16.0",
    "mutagen>=1.48.1",
    "procrastinate>=3.11.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
    "yt-dlp[default,deno]>=2026.10.26",
]

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ep"
module-root = ""

[tool.pytest]
testpaths = ["tests"]
addopts = ["-m", "not network"]
strict = true
markers = [
    "network: hits the network or downloads audio (opt-in: pytest -m network)",
]

[tool.alembic]
script_location = "%(here)s/alembic"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
# The database URL comes from EP_DATABASE_URL (see alembic/env.py).

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ep"]
known-third-party = ["alembic"]
