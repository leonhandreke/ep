# Server hooks (prek workspace project; see ../prek.toml). Hooks run with
# server/ as the working directory. Tool settings live in pyproject.toml.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-added-large-files" },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run --frozen ruff check --fix", language = "system", types_or = ["python", "pyi"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run --frozen ruff format", language = "system", types_or = ["python", "pyi"] },
    { id = "ty", name = "ty check", entry = "uv run --frozen ty check", language = "system", types_or = ["python", "pyi"], pass_filenames = false },
    { id = "uv-lock", name = "uv lock --check", entry = "uv lock --check", language = "system", files = "^(pyproject\\.toml|uv\\.lock)$", pass_filenames = false },
]
